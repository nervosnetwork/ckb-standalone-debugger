name: Rust

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build
    - name: Build ckb-vm-signal-profiler example
      run: cargo build --examples --package ckb-vm-signal-profiler

  build-linux-asm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --features=asm

  build-wasm:
     runs-on: ubuntu-latest
     steps:
     - uses: actions/checkout@v4
     - name: Build wasm-pack
       run: cd ckb-debugger && cargo install wasm-pack && wasm-pack build --target nodejs
     - name: Build wasm32-unknown-unknown
       run: cd ckb-debugger && rustup target add wasm32-unknown-unknown && cargo build --target wasm32-unknown-unknown
     - name: Build wasm32-wasip1
       run: cd ckb-debugger && rustup target add wasm32-wasip1 && cargo build --target wasm32-wasip1


  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cd ckb-debugger && cargo build
